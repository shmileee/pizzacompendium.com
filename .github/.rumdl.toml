[global]
# The content uses a custom `:::` block syntax and typographic quotes; it must
# never be reflowed or auto-fixed. (The hook also excludes it, because explicit
# file arguments bypass this setting.)
exclude = ["content/**"]
enable = [
  "MD003",
  "MD004",
  "MD007",
  "MD009",
  "MD013",
  "MD022",
  "MD029",
  "MD030",
  "MD046",
  "MD047",
]
line-length = 80

[MD003]
style = "atx"

[MD004]
style = "asterisk"

[MD007]
indent = 4

[MD009]
strict = true

[MD013]
code-blocks = false
headings = false
reflow = true
tables = false

[MD029]
style = "one_or_ordered"

[MD030]
ul-single = 3
ul-multi = 3
ol-single = 2
ol-multi = 2

[MD046]
style = "fenced"
